<!DOCTYPE html>
<!--
  小红书信息图模板 · cream-glass 版 · 375×500 · v3(2026-08-12)
  完全照搬 catpaw 版本(单栏叙事:品牌线+玻璃质感 logo+产品名+定位+一句话+票数)，
  废弃 v2 的橙色卡片/6锚点结构化版式。占位符 {{...}} 由 scripts/render_xhs.py 替换。

  logo：<img class="logo cover" src="file:///workspace/ph-daily/xhs/2026-10-03/.tmp/logos/cubicle-2.png"> 由渲染脚本注入 <img class="logo cover"> 或失败兜底的纯色首字母。
-->
<html lang="zh"><head><meta charset="UTF-8">
<title>Cubicle · 小红书信息图</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:375px;height:500px;background:transparent;overflow:hidden;font-family:-apple-system,"PingFang SC","SF Pro Display",sans-serif}
  .stage{width:375px;height:500px;position:relative;overflow:hidden;color:#2B2018;
    background:
      radial-gradient(340px 260px at 50% 6%, rgba(255,238,214,.9), transparent 60%),
      radial-gradient(200px 180px at 92% 96%, rgba(240,200,160,.45), transparent 60%),
      linear-gradient(164deg,#FBF5EA 0%,#F6ECDA 50%,#EFE0C6 100%)}
  .grain{position:absolute;inset:0;pointer-events:none;opacity:.4;mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='0.5'/></svg>")}
  .tear{position:absolute;top:0;left:0;right:0;height:18px;z-index:2;
    background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,0));
    -webkit-mask-image:radial-gradient(3px 3px at 12px 100%,#0000 95%,#000),radial-gradient(3px 3px at 30px 100%,#0000 95%,#000),radial-gradient(3px 3px at 48px 100%,#0000 95%,#000),radial-gradient(3px 3px at 66px 100%,#0000 95%,#000),radial-gradient(3px 3px at 84px 100%,#0000 95%,#000),radial-gradient(3px 3px at 102px 100%,#0000 95%,#000),radial-gradient(3px 3px at 120px 100%,#0000 95%,#000),radial-gradient(3px 3px at 138px 100%,#0000 95%,#000),radial-gradient(3px 3px at 156px 100%,#0000 95%,#000),radial-gradient(3px 3px at 174px 100%,#0000 95%,#000),radial-gradient(3px 3px at 192px 100%,#0000 95%,#000),radial-gradient(3px 3px at 210px 100%,#0000 95%,#000),radial-gradient(3px 3px at 228px 100%,#0000 95%,#000),radial-gradient(3px 3px at 246px 100%,#0000 95%,#000),radial-gradient(3px 3px at 264px 100%,#0000 95%,#000),radial-gradient(3px 3px at 282px 100%,#0000 95%,#000),radial-gradient(3px 3px at 300px 100%,#0000 95%,#000),radial-gradient(3px 3px at 318px 100%,#0000 95%,#000),radial-gradient(3px 3px at 336px 100%,#0000 95%,#000),radial-gradient(3px 3px at 354px 100%,#0000 95%,#000);
    mask-image:radial-gradient(3px 3px at 12px 100%,#0000 95%,#000),radial-gradient(3px 3px at 30px 100%,#0000 95%,#000),radial-gradient(3px 3px at 48px 100%,#0000 95%,#000),radial-gradient(3px 3px at 66px 100%,#0000 95%,#000),radial-gradient(3px 3px at 84px 100%,#0000 95%,#000),radial-gradient(3px 3px at 102px 100%,#0000 95%,#000),radial-gradient(3px 3px at 120px 100%,#0000 95%,#000),radial-gradient(3px 3px at 138px 100%,#0000 95%,#000),radial-gradient(3px 3px at 156px 100%,#0000 95%,#000),radial-gradient(3px 3px at 174px 100%,#0000 95%,#000),radial-gradient(3px 3px at 192px 100%,#0000 95%,#000),radial-gradient(3px 3px at 210px 100%,#0000 95%,#000),radial-gradient(3px 3px at 228px 100%,#0000 95%,#000),radial-gradient(3px 3px at 246px 100%,#0000 95%,#000),radial-gradient(3px 3px at 264px 100%,#0000 95%,#000),radial-gradient(3px 3px at 282px 100%,#0000 95%,#000),radial-gradient(3px 3px at 300px 100%,#0000 95%,#000),radial-gradient(3px 3px at 318px 100%,#0000 95%,#000),radial-gradient(3px 3px at 336px 100%,#0000 95%,#000),radial-gradient(3px 3px at 354px 100%,#0000 95%,#000);
    filter:drop-shadow(0 1px 1px rgba(90,60,20,.12))}
  .inner{position:relative;z-index:3;padding:36px 26px 20px;height:100%;display:flex;flex-direction:column;align-items:center;text-align:center}
  .brandline{font-size:8.5px;font-weight:700;letter-spacing:4px;color:#A8876A;margin-bottom:30px}

  .glass{width:108px;height:108px;border-radius:30px;position:relative;overflow:hidden;
    background:linear-gradient(160deg,rgba(255,255,255,0.52),rgba(255,255,255,0.20));
    border:1.5px solid rgba(255,255,255,0.72);
    box-shadow:0 18px 40px rgba(120,70,25,0.30),
      inset 0 1.5px 0 rgba(255,255,255,0.9),
      inset 0 -14px 26px rgba(255,214,178,0.30);
    -webkit-backdrop-filter:blur(14px) saturate(150%);
    backdrop-filter:blur(14px) saturate(150%)}
  .glass::before{content:"";position:absolute;inset:-12px;z-index:0;
    background:
      radial-gradient(60px 60px at 22% 18%, rgba(255,190,120,0.55), transparent 70%),
      radial-gradient(70px 70px at 82% 78%, rgba(255,140,70,0.45), transparent 70%),
      radial-gradient(50px 50px at 78% 20%, rgba(255,235,210,0.6), transparent 70%)}
  .glass .logo{position:absolute;inset:0;z-index:1;width:100%;height:100%;mix-blend-mode:multiply}
  .glass .logo.cover{object-fit:cover}
  .glass .logo.contain{object-fit:contain;padding:7px}
  .glass .logo-fallback{position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;
    font-size:44px;font-weight:900;color:#C2541C}
  .glass::after{content:"";position:absolute;top:0;left:8%;right:8%;height:26px;z-index:2;
    background:linear-gradient(180deg,rgba(255,255,255,0.55),transparent);
    border-radius:18px 18px 40% 40%}

  .name{font-size:38px;font-weight:900;letter-spacing:-.5px;color:#20150C;margin-top:20px;line-height:1.1;text-wrap:balance;overflow-wrap:anywhere;word-break:normal;line-break:strict}
  .sub{font-size:11px;font-weight:700;letter-spacing:2px;color:#C2541C;margin-top:10px;text-wrap:balance;overflow-wrap:anywhere;word-break:normal;line-break:strict;max-width:320px}
  .one{font-size:13px;line-height:1.75;color:#5A4630;font-weight:600;margin-top:24px;max-width:320px;text-wrap:balance;overflow-wrap:anywhere;word-break:normal;line-break:strict}
  .one b{color:#C2541C;font-weight:700}
  .numline{display:flex;align-items:baseline;gap:6px;margin-top:30px;padding-top:20px;border-top:1px solid rgba(90,60,20,.15);width:100%;justify-content:center}
  .numline .vote{font-size:34px;font-weight:900;color:#20150C;letter-spacing:-1px}
  .numline .voteb{font-size:11px;font-weight:700;color:#A8876A}
  .foot{position:absolute;bottom:16px;left:0;right:0;display:flex;justify-content:space-between;padding:0 26px;font-size:8px;color:#B39A7C;font-weight:600}
</style>
</head><body>
<div class="stage">
  <div class="grain"></div>
  <div class="tear"></div>
  <div class="inner">
    <div class="brandline">PRODUCT HUNT · DAILY PICK</div>
    <div class="glass">
      <img class="logo cover" src="file:///workspace/ph-daily/xhs/2026-10-03/.tmp/logos/cubicle-2.png">

    <div class="name">Cubicle</div>
    <div class="sub">只读Agent看板</div>

    <div class="numline"><span class="vote">69</span><span class="voteb">人点赞 · 今日 #10</span></div>
    <div class="foot"><span>来源：Product Hunt 每日榜</span><span>2026-10-03</span></div>
  </div>
</div></body></html>
